<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0c10"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00e5a0" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left: logo icon -->
  <rect x="80" y="195" width="200" height="200" rx="44" fill="#111318"/>
  <rect x="162" y="218" width="18" height="154" rx="4" fill="#00e5a0"/>
  <path d="M162 258 Q162 234 171 234 Q202 234 202 252 Q202 270 171 276 Q140 282 140 300 Q140 318 171 318 Q182 318 182 308"
    fill="none" stroke="#00e5a0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Up arrow badge -->
  <rect x="248" y="202" width="52" height="52" rx="12" fill="#00e5a018"/>
  <polyline points="257,234 274,210 291,234" fill="none" stroke="#00e5a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="274" y1="210" x2="274" y2="240" stroke="#00e5a0" stroke-width="5" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="80" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f0f4f8">Gigs</text>
  <text x="230" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#00e5a0">Profit</text>

  <!-- Tagline -->
  <text x="80" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#6b7280">Your gross pay isn't your income.</text>

  <!-- Right: stat card -->
  <rect x="750" y="160" width="370" height="310" rx="24" fill="#111318"/>
  <text x="935" y="230" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">GROSS PAY</text>
  <text x="935" y="284" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="#f0f4f8" text-anchor="middle">$847</text>
  <line x1="780" y1="310" x2="1100" y2="310" stroke="#1e2128" stroke-width="1"/>
  <text x="935" y="360" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">REAL TAKE-HOME</text>
  <text x="935" y="416" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="#00e5a0" text-anchor="middle">$491</text>
  <text x="935" y="448" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">$356 in costs you didn't see</text>

  <!-- Bottom strip -->
  <rect x="0" y="580" width="1200" height="50" fill="#111318"/>
  <text x="600" y="612" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Uber · DoorDash · Lyft · Instacart · Amazon Flex · Grubhub · Shipt</text>
</svg>
